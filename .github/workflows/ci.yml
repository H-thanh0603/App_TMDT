name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: t
          POSTGRES_PASSWORD: t
          POSTGRES_DB: e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: Smart_MiniMart_AI/backend
    env:
      DATABASE_URL: postgresql://t:t@localhost:5432/e2e
      JWT_ACCESS_SECRET: ci-access-secret-32chars-minimum
      JWT_REFRESH_SECRET: ci-refresh-secret-32chars-minimum
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Smart_MiniMart_AI/backend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npx prisma migrate deploy
      - run: npm run test:e2e

  ocr:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Smart_MiniMart_AI/ocr-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests -q

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Smart_MiniMart_AI/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Smart_MiniMart_AI/mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
