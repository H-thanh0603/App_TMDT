name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Smart_MiniMart_AI/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Smart_MiniMart_AI/backend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test

  ocr:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Smart_MiniMart_AI/ocr-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests -q

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Smart_MiniMart_AI/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Smart_MiniMart_AI/mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
