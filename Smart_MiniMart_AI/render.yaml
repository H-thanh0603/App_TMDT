# Exported from render.com Blueprint
# https://render.com/docs/blueprint-spec
#
# After connecting GitHub repo H-thanh0603/App_TMDT:
# Render Dashboard → New → Blueprint → select this file
# Then set env secrets in dashboard (JWT, DEEPSEEK, DATABASE_URL from Neon).

services:
  - type: web
    name: smart-minimart-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: Smart_MiniMart_AI/backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health/ready
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: API_PREFIX
        value: api/v1
      # Production: whitelist domain frontend thật (không để "*").
      # Điền domain prod khi deploy, ví dụ https://app.minimart.vn
      - key: CORS_ORIGIN
        value: "" # <-- ĐIỀN DOMAIN PROD (vd https://app.minimart.vn); để trống = chặn CORS strict
      - key: ALLOWED_HOSTS
        value: "" # <-- ĐIỀN host API prod (vd smart-minimart-api.onrender.com)
      - key: TRUST_PROXY
        value: "1"
      # Swagger: production tắt mặc định, chỉ bật khi cần debug (đặt "true")
      - key: ENABLE_SWAGGER
        value: ""
      - key: JWT_ACCESS_EXPIRES
        value: 15m
      - key: JWT_REFRESH_EXPIRES
        value: 14d
      - key: AI_DEFAULT_PROVIDER
        value: deepseek
      - key: AI_DEFAULT_MODEL
        value: deepseek-chat
      - key: AI_FALLBACK_PROVIDER
        value: mock
      - key: OCR_DEFAULT_ENGINE
        value: mock
      - key: OCR_SERVICE_URL
        value: ""
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: OCR_API_KEY
        generateValue: true
      - key: AI_ENCRYPTION_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      # Q139: Sentry DSN (để trống = tắt). Điền DSN khi vận hành.
      - key: SENTRY_DSN
        sync: false
