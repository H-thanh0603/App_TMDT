version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: minimart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: minimart
      POSTGRES_PASSWORD: minimart_dev_2026
      POSTGRES_DB: smart_minimart
    ports:
      - "5432:5432"
    volumes:
      - minimart_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minimart -d smart_minimart"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: minimart-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@minimart.vn
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      - postgres

  ocr:
    build:
      context: ./ocr-service
      dockerfile: Dockerfile
    container_name: minimart-ocr
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      OCR_DEFAULT_ENGINE: mock
      LOG_LEVEL: INFO
    volumes:
      - ./ocr-service/samples:/app/samples:ro

volumes:
  minimart_pgdata:
    name: minimart_pgdata
